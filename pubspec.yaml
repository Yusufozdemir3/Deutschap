name: deutschap
description: "Deutschap: learn German through stories, a personal vocabulary library and real conversations."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.0

# Dependency rationale: docs/adr/0003-dependencies.md
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.1.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
