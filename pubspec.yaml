name: deutschap
description: "Deutschap: learn German through stories, a personal vocabulary library and real conversations."
publish_to: 'none'
version: 0.4.0+6

environment:
  sdk: ^3.11.0

# Dependency rationale: docs/adr/0003-dependencies.md
dependencies:
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  sqflite_common_ffi_web: ^1.1.1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
